<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد أكواد VLESS المانيا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1E1E1E;
            --gold: #D4AF37;
            --gold-light: #FFD700;
            --text-color: #E0E0E0;
            --text-secondary: #B0B0B0;
            --dark-blue: #0d356e;
            --darker-blue: #0a2347;
            --success-green: #28a745;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* النقاط المتحركة (الفقاقيع الذهبية) */
        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }
        
        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            animation: float 15s infinite ease-in;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                bottom: -100px;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                bottom: 100%;
            }
        }
        
        /* تأثير الهبوط للعنوان */
        .header {
            text-align: center;
            padding: 30px 20px;
            animation: slideDown 1s ease-out;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            animation: glow 2s infinite alternate;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }
        
        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            max-width: 100%;
        }
        
        /* تأثير الهبوط للمربع */
        .form-box {
            background: linear-gradient(145deg, #1E1E1E 0%, #2A2A2A 100%);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.8s ease-out 0.3s forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            margin: 15px 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        
        /* زر التوليد المعدل */
        .btn {
            padding: 12px 20px; /* حجم أصغر قليلاً */
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--darker-blue) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem; /* حجم خط أصغر قليلاً */
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            background: linear-gradient(135deg, var(--darker-blue) 0%, var(--dark-blue) 100%);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        /* زر النسخ المعدل */
        .copy-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #007bff 0%, #00a1ff 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin: 15px 0;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4);
        }
        
        .copy-btn.copied {
            background: linear-gradient(135deg, var(--success-green) 0%, #2ecc71 100%);
            animation: pulse 0.5s;
        }
        
        /* بقية الأنماط */
        .result-container {
            margin-top: 25px;
            width: 100%;
            text-align: center;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        
        .result-container.show {
            opacity: 1;
            height: auto;
        }
        
        .loading-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        
        .loading {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        /* الأنيميشنز */
        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
            }
            to {
                text-shadow: 0 0 15px rgba(212, 175, 55, 0.8), 0 0 20px rgba(212, 175, 55, 0.6);
            }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .alert {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }
        
        .codes-left {
            color: var(--gold);
            font-weight: 600;
            margin-top: 15px;
        }
        
        /* التنسيق للشاشات الصغيرة */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .form-box {
                padding: 25px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .form-box {
                padding: 20px;
            }
            
            input {
                padding: 10px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- الفقاقيع الذهبية المتحركة -->
    <div class="bubbles" id="bubbles"></div>

    <div class="header">
        <h1>توليد أكواد VLESS المانيا</h1>
    </div>

    <div class="container">
        <div class="form-box">
            <form id="vlessForm">
                <input type="text" id="username" placeholder="ادخل اليوزر الخاص بك" required>
                <input type="text" id="host" placeholder="ادخل الهوست الخاص بك" required>
                <button type="submit" class="btn" id="generateBtn">
                    <i class="fas fa-key"></i> توليد الكود
                </button>
            </form>
            
            <div class="loading-container" id="loadingContainer">
                <div class="loading"></div>
                <p class="loading-text">جاري توليد الكود، الرجاء الانتظار...</p>
            </div>
            
            <div class="alert" id="alert"></div>
            <div class="codes-left" id="codesLeft">الأكواد المتبقية: 200</div>
            
            <div class="result-container" id="resultContainer">
                <button class="copy-btn" id="copyBtn">
                    <i class="fas fa-copy"></i> نسخ الكود الآن
                </button>
                <p class="expiration" id="expirationDate"></p>
            </div>
        </div>
    </div>

    <script>
        // إنشاء الفقاقيع الذهبية
        function createBubbles() {
            const bubblesContainer = document.getElementById('bubbles');
            const bubbleCount = 15;
            
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // تحديد حجم عشوائي للفقاعة
                const size = Math.random() * 100 + 50;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                
                // تحديد موضع عشوائي
                bubble.style.left = `${Math.random() * 100}%`;
                
                // تحديد مدة الحركة
                const duration = Math.random() * 10 + 10;
                bubble.style.animationDuration = `${duration}s`;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                
                // إضافة الفقاعة إلى الحاوية
                bubblesContainer.appendChild(bubble);
            }
        }
        
        // Configuration
        const maxCodes = 200;
        let availableCodes = maxCodes;
        const cooldownTime = 5 * 60 * 1000; // 5 دقائق بالميلي ثانية
        let currentCode = '';
        
        // DOM Elements
        const form = document.getElementById("vlessForm");
        const generateBtn = document.getElementById("generateBtn");
        const loadingContainer = document.getElementById("loadingContainer");
        const resultContainer = document.getElementById("resultContainer");
        const copyBtn = document.getElementById("copyBtn");
        const alertEl = document.getElementById("alert");
        const codesLeftEl = document.getElementById("codesLeft");
        const expirationEl = document.getElementById("expirationDate");
        
        // Update codes left display
        codesLeftEl.textContent = `الأكواد المتبقية: ${availableCodes}`;
        
        // Form Submission
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            
            // Check cooldown
            const lastGenerated = localStorage.getItem("lastGeneratedTime");
            const now = new Date().getTime();
            
            if (lastGenerated && now - lastGenerated < cooldownTime) {
                const remainingTime = Math.ceil((cooldownTime - (now - lastGenerated)) / 1000);
                showAlert(`يجب الانتظار ${remainingTime} ثانية قبل توليد كود جديد`, 'error');
                return;
            }
            
            // Check if codes are available
            if (availableCodes <= 0) {
                showAlert('لقد تم استنفاذ جميع الأكواد المتاحة', 'error');
                return;
            }
            
            // Get input values
            const username = document.getElementById("username").value.trim() || generateRandomUsername();
            const host = document.getElementById("host").value.trim() || generateRandomHost();
            
            // Validate inputs
            if (!username || !host) {
                showAlert('الرجاء إدخال اليوزر والهوست', 'error');
                return;
            }
            
            // Generate code
            currentCode = `vless://I_Love_🇫🇷_${username}@${host}:443?encryption=none&security=tls&sni=${host}&type=grpc&serviceName=vless-grpc&mode=gun#${username}-gRPC`;
            
            // Set expiration date (7 days from now)
            const expirationDate = new Date();
            expirationDate.setDate(expirationDate.getDate() + 7);
            expirationEl.textContent = `صلاحية الكود حتى: ${expirationDate.toLocaleDateString()}`;
            
            // Start generation process
            startGeneration();
        });
        
        // Start generation with loading effect
        function startGeneration() {
            // Disable form
            generateBtn.disabled = true;
            form.querySelectorAll('input').forEach(input => input.disabled = true);
            
            // Show loading
            loadingContainer.style.display = 'flex';
            resultContainer.classList.remove('show');
            alertEl.textContent = '';
            
            // Simulate generation delay (10 seconds)
            setTimeout(() => {
                finishGeneration();
            }, 10000);
        }
        
        // Finish generation process
        function finishGeneration() {
            // Hide loading
            loadingContainer.style.display = 'none';
            
            // Update codes count
            availableCodes--;
            codesLeftEl.textContent = `الأكواد المتبقية: ${availableCodes}`;
            
            // Show result
            resultContainer.classList.add('show');
            
            // Enable form
            generateBtn.disabled = false;
            form.querySelectorAll('input').forEach(input => input.disabled = false);
            
            // Set cooldown
            localStorage.setItem("lastGeneratedTime", new Date().getTime());
            
            // Show success message
            showAlert('تم توليد الكود بنجاح!', 'success');
        }
        
        // Copy button click handler
        copyBtn.addEventListener('click', function() {
            // Copy to clipboard
            navigator.clipboard.writeText(currentCode).then(() => {
                // Change button style temporarily
                copyBtn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> نسخ الكود الآن';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        });
        
        // Helper functions
        function generateRandomUsername() {
            const randomNum = Math.floor(Math.random() * 10000);
            return `user${randomNum}`;
        }
        
        function generateRandomHost() {
            const hosts = ["fr1.server.com", "fr2.server.com", "fr3.server.com", "fr4.server.com", "fr5.server.com"];
            return hosts[Math.floor(Math.random() * hosts.length)];
        }
        
        function showAlert(message, type) {
            alertEl.textContent = message;
            alertEl.style.color = type === 'error' ? '#ff6b6b' : '#2ecc71';
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                if (alertEl.textContent === message) {
                    alertEl.textContent = '';
                }
            }, 5000);
        }
        
        // Initialize
        window.addEventListener('load', function() {
            createBubbles();
            
            const lastGenerated = localStorage.getItem("lastGeneratedTime");
            const now = new Date().getTime();
            
            if (lastGenerated && now - lastGenerated < cooldownTime) {
                const remainingTime = Math.ceil((cooldownTime - (now - lastGenerated)) / 1000);
                showAlert(`يمكنك توليد كود جديد بعد ${remainingTime} ثانية`, 'error');
                generateBtn.disabled = true;
                
                // Enable button after cooldown
                setTimeout(() => {
                    generateBtn.disabled = false;
                    alertEl.textContent = '';
                }, cooldownTime - (now - lastGenerated));
            }
        });
    </script>
</body>
</html>
