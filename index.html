<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="b8a671daaac5fb48bf809fde23b4d7bda470d852" content="b8a671daaac5fb48bf809fde23b4d7bda470d852" />
    <title>SSH NOX - قسم الأكواد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1E1E1E;
            --gold: #D4AF37;
            --gold-light: #FFD700;
            --text-color: #E0E0E0;
            --text-secondary: #B0B0B0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        /* Header Styles */
        .header {
            background: linear-gradient(135deg, #000000 0%, #1A1A1A 100%);
            color: var(--gold);
            padding: 25px 15px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--gold);
            animation: fadeIn 1s ease-in-out;
        }
        
        .header h1 {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
            position: relative;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            letter-spacing: 0.5px;
        }
        
        .header p {
            font-size: 1rem;
            margin-top: 10px;
            color: var(--text-secondary);
            position: relative;
            font-weight: 300;
        }
        
        /* Main Content */
        .main-container {
            padding: 25px 15px;
            max-width: 100%;
            margin: 0 auto;
        }
        
        .section-title-container {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            padding: 0 20px;
        }
        
        .section-title {
            font-size: 1.8rem;
            color: var(--gold);
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        
        /* Cards Grid */
        .sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 0;
        }
        
        .section {
            background: linear-gradient(145deg, #1E1E1E 0%, #2A2A2A 100%);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .section h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: var(--gold);
            text-align: center;
            font-weight: 600;
        }
        
        .flag {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
            transition: all 0.2s ease;
        }
        
        .section:active {
            transform: scale(0.98);
        }
        
        /* Button Styles */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        
        .btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(212, 175, 55, 0.3);
        }
        
        .btn i {
            font-size: 0.9rem;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Mobile-Specific Enhancements */
        @media (max-width: 480px) {
            .header {
                padding: 20px 10px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 0.9rem;
            }
            
            .section-title {
                font-size: 1.5rem;
            }
            
            .sections {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
            }
            
            .section {
                padding: 12px;
            }
            
            .section h2 {
                font-size: 1.2rem;
            }
            
            .flag {
                height: 90px;
            }
            
            .btn {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
        }
        
        /* Very Small Screens */
        @media (max-width: 360px) {
            .sections {
                grid-template-columns: 1fr 1fr;
            }
            
            .section-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <!-- الواجهة العلوية بعرض الموقع -->
    <div class="header">

    <div class="main-container">

                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Flag_of_Denmark.svg" alt="Denmark Flag" class="flag">

    <script>
        // تحسينات للأجهزة المحمولة
        document.addEventListener('DOMContentLoaded', function() {
            // منع التكبير بالنقر المزدوج
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // تحسين تجربة اللمس للأزرار
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                });
                
                button.addEventListener('touchend', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        });
    </script>

</html>
