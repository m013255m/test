<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="b8a671daaac5fb48bf809fde23b4d7bda470d852" content="b8a671daaac5fb48bf809fde23b4d7bda470d852" />
    <title>قسم الأكواد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url(https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap);
        
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1E1E1E;
            --gold: #D4AF37;
            --gold-light: #FFD700;
            --text-color: #E0E0E0;
            --text-secondary: #B0B0B0;
            --dark-blue: #1565C0;
            --darker-blue: #0D47A1;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Tajawal, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 120px;
            position: relative;
        }
        
        /* Header Styles */
        .header {
            background: linear-gradient(135deg, #000000 0%, #1A1A1A 100%);
            color: var(--gold);
            padding: 30px 20px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--gold);
            animation: fadeIn 1.5s ease-in-out;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
            z-index: 0;
        }
        
        .header h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 700;
            position: relative;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 1px;
            animation: glow 2s infinite alternate;
        }
        
        .header p {
            font-size: 1.2rem;
            margin-top: 15px;
            color: var(--text-secondary);
            position: relative;
            font-weight: 300;
        }
        
        /* Main Content */
        .main-container {
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1.section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--gold);
            position: relative;
            width: 100%;
            display: block;
            padding-bottom: 25px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            animation: titleGlow 2s infinite alternate;
        }
        
        h1.section-title::after {
            content: '';
            position: absolute;
            bottom: 10px;
            right: 50%;
            transform: translateX(50%);
            width: 250px;
            height: 4px;
            background: linear-gradient(90deg, 
                          transparent, 
                          var(--gold), 
                          var(--gold-light), 
                          var(--gold), 
                          transparent);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
            z-index: 1;
        }
        
        h1.section-title::before {
            content: '';
            position: absolute;
            bottom: 8px;
            right: 50%;
            transform: translateX(50%);
            width: 270px;
            height: 8px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 4px;
            filter: blur(2px);
            z-index: 0;
            animation: linePulse 3s infinite ease-in-out;
        }
        
        /* Cards Grid */
        .sections {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px 0;
            width: 100%;
        }
        
        .section {
            background: linear-gradient(145deg, #1E1E1E 0%, #2A2A2A 100%);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            z-index: 1;
            width: 100%;
            max-width: 280px;
        }
        
        .section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transform: rotate(45deg);
            z-index: -1;
            transition: all 0.6s ease;
            opacity: 0;
        }
        
        .section:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: var(--gold);
        }
        
        .section:hover::before {
            opacity: 1;
            animation: shine 1.5s;
        }
        
        .section h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--gold);
            text-align: center;
            font-weight: 600;
        }
        
        .flag {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        
        .section:hover .flag {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        /* Button Styles */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--darker-blue) 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--darker-blue) 0%, var(--dark-blue) 100%);
            z-index: -1;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
        }
        
        .btn:hover::before {
            opacity: 1;
        }
        
        .btn i {
            font-size: 1.1rem;
        }
        
        /* Social Circles */
        .social-circles {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 100;
        }
        
        .social-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #1E1E1E 0%, #2A2A2A 100%);
            border: 1px solid #333;
        }
        
        .social-circle:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        
        .social-circle img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(212, 175, 55, 0.3);
            border-top: 8px solid var(--gold);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin: 0 auto 20px;
        }
        
        .loading-text {
            color: var(--gold);
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 20px;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
            }
            to {
                text-shadow: 0 0 15px rgba(212, 175, 55, 0.8), 0 0 20px rgba(212, 175, 55, 0.6);
            }
        }
        
        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            }
            100% {
                text-shadow: 0 0 25px rgba(212, 175, 55, 0.9), 
                            0 0 35px rgba(212, 175, 55, 0.5);
            }
        }
        
        @keyframes linePulse {
            0% {
                opacity: 0.15;
                width: 270px;
            }
            50% {
                opacity: 0.25;
                width: 290px;
            }
            100% {
                opacity: 0.15;
                width: 270px;
            }
        }
        
        @keyframes shine {
            0% {
                left: -100%;
            }
            20% {
                left: 100%;
            }
            100% {
                left: 100%;
            }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(50px, 50px);
            }
            100% {
                transform: translate(0, 0);
            }
        }
        
        /* Floating Particles Effect */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite ease-in-out;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            h1.section-title {
                font-size: 2rem;
                padding-bottom: 20px;
            }
            
            h1.section-title::after {
                width: 200px;
                bottom: 8px;
            }
            
            h1.section-title::before {
                width: 220px;
                bottom: 6px;
            }
            
            .social-circles {
                bottom: 20px;
                gap: 20px;
            }
            
            .social-circle {
                width: 60px;
                height: 60px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .section {
                padding: 20px;
                max-width: 250px;
            }
            
            .section h2 {
                font-size: 1.5rem;
            }
            
            .flag {
                height: 100px;
            }
            
            h1.section-title {
                font-size: 1.8rem;
                padding-bottom: 15px;
            }
            
            h1.section-title::after {
                width: 180px;
                bottom: 7px;
            }
            
            h1.section-title::before {
                width: 200px;
                bottom: 5px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .loading-spinner {
                width: 60px;
                height: 60px;
                border-width: 6px;
            }
            
            .loading-text {
                font-size: 1.2rem;
            }
            
            .social-circles {
                bottom: 15px;
                gap: 15px;
            }
            
            .social-circle {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Particles Background -->
    <div class="particles" id="particles"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل، الرجاء الانتظار...</div>
        </div>
    </div>
    
    <!-- الواجهة العلوية بعرض الموقع مع تأثير حركي -->
    <div class="header">
        <h1>SSH NOX</h1>
        <p>Get Free SSH and VPN Account for 30 Days</p>
    </div>

    <div class="main-container">
        <h1 class="section-title">قسم الأكواد</h1>
        
        <div class="sections">
            <div class="section">
                <img src="https://i.postimg.cc/tgKQ11sD/Flag-of-Belgium-1830-svg.png" alt="Belgium Flag" class="flag">
                <h2>BELGIUM</h2>
                <div class="btn-container">
                    <a href="generate_belgium.html" class="btn" data-country="belgium">
                        <i class="fas fa-key"></i> انتقل إلى توليد الكود
                    </a>
                </div>
            </div>
            
            <div class="section">
                <img src="https://i.postimg.cc/gjpCDfqZ/Flag-of-Australia-converted-svg.png" alt="Austria Flag" class="flag">
                <h2>AUSTRIA</h2>
                <div class="btn-container">
                    <a href="generate_austria.html" class="btn" data-country="austria">
                        <i class="fas fa-key"></i> انتقل إلى توليد الكود
                    </a>
                </div>
            </div>
            
            <div class="section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Flag_of_Denmark.svg" alt="Denmark Flag" class="flag">
                <h2>DENMARK</h2>
                <div class="btn-container">
                    <a href="generate_denmark.html" class="btn" data-country="denmark">
                        <i class="fas fa-key"></i> انتقل إلى توليد الكود
                    </a>
                </div>
            </div>
            
            <div class="section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/cf/Flag_of_Canada.svg" alt="Canada Flag" class="flag">
                <h2>CANADA</h2>
                <div class="btn-container">
                    <a href="generate_canada.html" class="btn" data-country="canada">
                        <i class="fas fa-key"></i> انتقل إلى توليد الكود
                    </a>
                </div>
            </div>
            
            <div class="section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Flag_of_France.svg" alt="France Flag" class="flag">
                <h2>FRANCE</h2>
                <div class="btn-container">
                    <a href="generate_france.html" class="btn" data-country="france">
                        <i class="fas fa-key"></i> انتقل إلى توليد الكود
                    </a>
                </div>
            </div>
            
            <div class="section">
                <img src="https://i.postimg.cc/W30R02rV/Flag-of-Germany-svg.png" alt="Germany Flag" class="flag">
                <h2>GERMANY</h2>
                <div class="btn-container">
                    <a href="generate_germany.html" class="btn" data-country="germany">
                        <i class="fas fa-key"></i> انتقل إلى توليد الكود
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Social Media Circles -->
    <div class="social-circles">
        <div class="social-circle" id="telegram-circle">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
        </div>
        <div class="social-circle" id="youtube-circle">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/72/YouTube_social_white_square_%282017%29.svg" alt="YouTube">
        </div>
    </div>
    
    <script>
        // إنشاء جزيئات متحركة
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 60;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 5 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                
                const duration = Math.random() * 20 + 10;
                particle.style.animationDuration = `${duration}s`;
                
                particle.style.animationDelay = `${Math.random() * 10}s`;
                
                particlesContainer.appendChild(particle);
                
                const keyframesName = `float-${i}`;
                const keyframes = `
                    @keyframes ${keyframesName} {
                        0% {
                            transform: translate(0, 0);
                        }
                        50% {
                            transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px);
                        }
                        100% {
                            transform: translate(0, 0);
                        }
                    }
                `;
                
                particle.style.animationName = keyframesName;
                
                const style = document.createElement('style');
                style.innerHTML = keyframes;
                document.head.appendChild(style);
            }
        }
        
        window.addEventListener('load', createParticles);
        
        window.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('.section');
            const scrollPosition = window.scrollY + window.innerHeight;
            
            sections.forEach(section => {
                const sectionPosition = section.offsetTop + section.offsetHeight / 2;
                
                if (scrollPosition > sectionPosition) {
                    section.style.opacity = '1';
                    section.style.transform = 'translateY(0)';
                }
            });
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('.section');
            sections.forEach((section, index) => {
                section.style.opacity = '0';
                section.style.transform = 'translateY(20px)';
                section.style.transition = `all 0.5s ease ${index * 0.1}s`;
                
                setTimeout(() => {
                    section.style.opacity = '1';
                    section.style.transform = 'translateY(0)';
                }, 100);
            });
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const loadingOverlay = document.getElementById('loadingOverlay');
                const country = this.getAttribute('data-country');
                
                loadingOverlay.classList.add('active');
                
                let scale = 1;
                const pulseInterval = setInterval(() => {
                    scale = scale === 1 ? 1.05 : 1;
                    loadingOverlay.querySelector('.loading-spinner').style.transform = `scale(${scale})`;
                }, 500);
                
                setTimeout(() => {
                    clearInterval(pulseInterval);
                    window.location.href = this.href;
                }, 10000);
            });
        });
        
        document.getElementById('telegram-circle').addEventListener('click', function() {
            window.location.href = 'https://t.me/your_telegram_channel';
        });
        
        document.getElementById('youtube-circle').addEventListener('click', function() {
            window.location.href = 'https://youtube.com/your_youtube_channel';
        });
    </script>
</body>
</html>
